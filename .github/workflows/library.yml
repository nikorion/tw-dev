name: Publish the nikorion plugin library

# Builds library/ (every plugin of plugins.json, pulled from its repository's
# default branch) and publishes it to this repository's GitHub Pages:
# https://nikorion.github.io/tw-dev/library/index.html
# Runs daily and on demand, so a plugin release appears within a day; run it by
# hand (Actions → Run workflow) to publish one right away.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node ci-plugins.cjs --all

      - run: npx --yes tiddlywiki@5.4.1 library --build library

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
